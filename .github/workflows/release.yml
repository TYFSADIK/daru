name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Stamp UI version
        run: make stamp-version VERSION=${{ github.ref_name }}
      - name: Cross-compile
        run: make release VERSION=${{ github.ref_name }}
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist/
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign artifacts
        env:
          COSIGN_YES: "true"
        run: |
          for f in dist/* sbom.spdx.json; do
            cosign sign-blob --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            sbom.spdx.json
          generate_release_notes: true
