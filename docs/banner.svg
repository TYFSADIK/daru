<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Daru">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0d1a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b8def" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5b8def" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1000" cy="150" r="420" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.25">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
  </g>

  <!-- logo mark, scaled from the project icon -->
  <g transform="translate(96,180) scale(4.2)">
    <rect x="4" y="4" width="56" height="56" rx="15" fill="#0b1220"/>
    <rect x="4" y="4" width="56" height="56" rx="15" fill="none" stroke="url(#d)" stroke-width="2.5" opacity="0.65"/>
    <rect x="16" y="20" width="26" height="5.5" rx="2.75" fill="url(#d)"/>
    <rect x="16" y="29.25" width="18" height="5.5" rx="2.75" fill="#38bdf8" opacity="0.85"/>
    <rect x="16" y="38.5" width="22" height="5.5" rx="2.75" fill="#2dd4bf" opacity="0.7"/>
    <circle cx="45" cy="41" r="7.5" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <line x1="50.3" y1="46.3" x2="54" y2="50" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="420" y="285" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="140" font-weight="800" fill="#f1f5fb" letter-spacing="-3">Daru</text>
  <text x="426" y="350" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#8db0f2">Self-hosted log analytics and SIEM</text>
  <text x="426" y="398" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#8495b0">Splunk-style search, dashboards, alerts, and recon. One Go binary.</text>

  <!-- feature pills -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">
    <g transform="translate(426,452)">
      <rect x="0" y="0" width="190" height="46" rx="8" fill="#1a2740" stroke="#5b8def" stroke-opacity="0.45"/>
      <text x="95" y="30" fill="#9cb8f5" text-anchor="middle">Pipe query language</text>
    </g>
    <g transform="translate(632,452)">
      <rect x="0" y="0" width="150" height="46" rx="8" fill="#152a24" stroke="#45b887" stroke-opacity="0.45"/>
      <text x="75" y="30" fill="#73c9a6" text-anchor="middle">No API keys</text>
    </g>
    <g transform="translate(798,452)">
      <rect x="0" y="0" width="210" height="46" rx="8" fill="#2a2412" stroke="#d59b3f" stroke-opacity="0.45"/>
      <text x="105" y="30" fill="#e0b876" text-anchor="middle">Authorized recon tools</text>
    </g>
  </g>

  <!-- platform row -->
  <text x="426" y="560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#64748b">Linux  .  macOS  .  Windows  .  Raspberry Pi  .  Android</text>
</svg>
